databases:
  - name: strathkonnekt-db
    plan: free
    databaseName: strath_konnekt
    user: strathkonnekt

services:
  - type: web
    name: strathkonnekt-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: strathkonnekt-db
          property: connectionString
      - key: CLIENT_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
